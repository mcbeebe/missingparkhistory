name: Weekly Watch Newsletter

# Sends the Weekly Watch to Buttondown subscribers. Each issue covers the previous
# Monday–Sunday week. GitHub often starts scheduled jobs hours late, so there are
# several chances: two Monday schedules, a Tuesday catch-up, and the run after each
# daily news bot. The script exits on other days and skips if the issue already went.
on:
  schedule:
    # UTC, off the top of the hour (less load). PDT: Mon 6:47 AM, Mon 11:47 AM, Tue 6:47 AM.
    - cron: "47 13 * * 1,2"
    - cron: "47 18 * * 1"
  workflow_run:
    workflows: ["Daily NPS News Update"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = build only (download the artifact); draft = create a Buttondown draft; send = email subscribers now"
        required: true
        default: "preview"
        type: choice
        options: [preview, draft, send]

permissions:
  contents: read

concurrency:
  group: weekly-newsletter
  cancel-in-progress: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main (includes the bot's newest commit)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build and send
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            python scripts/send_newsletter.py --mode send --scheduled
          else
            python scripts/send_newsletter.py --mode "${{ inputs.mode }}"
          fi

      - name: Upload preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-preview
          path: newsletter-preview.html
          if-no-files-found: ignore
